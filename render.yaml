services:
  - type: web
    name: scribd-dl
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: DOCKER
        value: "true"
      # PORT is automatically set by Render, no need to specify
    healthCheckPath: /api/status
    autoDeploy: true

